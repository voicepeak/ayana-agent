[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ayana-agent"
version = "0.3.16"
description = "Ayana desktop teaching assistant runtime"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "Pillow>=11,<13", "websockets>=14,<18", "comtypes>=1.4,<2; sys_platform=='win32'", "pypdf>=5,<7"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
windows = ["comtypes>=1.4,<2"]
stt = ["faster-whisper>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["services*", "native*", "packages*"]

[tool.setuptools.package-data]
"services.agent.prompts" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

