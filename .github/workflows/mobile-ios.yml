name: Build iOS mobile package
on:
  workflow_dispatch:
    inputs:
      run_public_gateway_smoke:
        description: Explicitly test a dedicated public gateway account with real speech
        type: boolean
        required: false
        default: false
  push:
    branches: [mobile]
    paths:
      - apps/mobile/**
      - scripts/build_mobile_ios.sh
      - scripts/verify_mobile_gateway.py
      - .github/workflows/mobile-ios.yml
permissions:
  contents: read
concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-gateway-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_public_gateway_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AYANA_MOBILE_SMOKE_ACTIVATION: ${{ secrets.AYANA_MOBILE_SMOKE_ACTIVATION }}
    steps:
      - uses: actions/checkout@v4
        if: env.AYANA_MOBILE_SMOKE_ACTIVATION != ''
      - uses: actions/setup-python@v5
        if: env.AYANA_MOBILE_SMOKE_ACTIVATION != ''
        with:
          python-version: '3.12'
      - name: Test public HTTPS, WSS and two real speech sentences outside the tailnet
        if: env.AYANA_MOBILE_SMOKE_ACTIVATION != ''
        run: |
          python -m pip install httpx 'websockets>=15,<17'
          python -m scripts.verify_mobile_gateway --remote
      - name: No ephemeral probe credential configured
        if: env.AYANA_MOBILE_SMOKE_ACTIVATION == ''
        run: echo 'Public gateway probe skipped; do not add owner or provider credentials to CI.'
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check bundled character assets
        run: test -f apps/mobile/src/generated/characters.json && test -d apps/mobile/public/characters
      - name: Check multi-turn model history protocol
        run: node --experimental-strip-types scripts/test_mobile_model_history.mjs
      - name: Check mobile state regressions
        run: node --experimental-strip-types --test scripts/test_mobile_state.mjs
      - name: Build unsigned IPA
        run: bash scripts/build_mobile_ios.sh
      - name: Render native PiP typography on iOS Simulator
        run: bash scripts/audit_mobile_ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ayana-iOS-layout-audit
          path: release/mobile/ios-layout-audit
          if-no-files-found: warn
      - name: Validate package and checksum
        run: |
          unzip -t release/mobile/Ayana-0.2.0-ios-unsigned.ipa
          cd release/mobile
          shasum -a 256 Ayana-0.2.0-ios-unsigned.ipa > SHA256SUMS-ios.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ayana-iOS-unsigned
          path: |
            release/mobile/*ios-unsigned.ipa
            release/mobile/SHA256SUMS-ios.txt
          if-no-files-found: error
